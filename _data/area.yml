features:
- name: Asset and Equipment Registries
  description: Industrial APIs expose hierarchical asset models for plants, lines,
    machines, and components, enabling normalized identification and tagging of physical
    equipment across SCADA, MES, and ERP systems.
- name: Telemetry Ingestion and Time-Series Storage
  description: Platforms like AWS IoT SiteWise, Amazon Timestream, and OSIsoft PI
    ingest high-frequency sensor readings from PLCs, gateways, and historians and
    expose them through query and streaming APIs.
- name: OPC UA, MQTT, and Sparkplug B Connectivity
  description: Edge gateways and brokers (Litmus, HiveMQ, Aklivity, AWS IoT Greengrass)
    bridge OT protocols such as OPC UA, MQTT Sparkplug B, and Modbus into cloud-native
    API surfaces.
- name: Predictive Maintenance and Anomaly Detection
  description: Services like Amazon Lookout for Equipment and Amazon Monitron apply
    ML to vibration, temperature, and current signals to predict equipment failures
    and surface maintenance work orders.
- name: Digital Twins and 3D Operational Context
  description: AWS IoT TwinMaker, Siemens MindSphere, and PTC ThingWorx assemble digital
    twin graphs that combine real-time telemetry, 3D scenes, and asset metadata into
    queryable APIs.
- name: Production Runs and Manufacturing Execution
  description: APIs expose work orders, production runs, batch records, OEE, and quality
    events to coordinate MES, ERP, and shop-floor systems across discrete and process
    manufacturing.
- name: Energy and Building Automation
  description: Schneider Electric, Honeywell, and Emerson APIs expose meter readings,
    HVAC controls, and energy-management workflows for industrial and commercial facilities.
- name: Edge Compute and Local Orchestration
  description: AWS IoT Greengrass, Node-RED, and Litmus run containers and flows on
    industrial gateways, exposing local APIs for protocol translation, store-and-forward,
    and on-device analytics.
use_cases:
- name: Plant-Wide Asset Performance Management
  description: Industrial operators unify asset data from OSIsoft PI, AWS IoT SiteWise,
    and AspenTech into APIs that power asset performance dashboards, reliability programs,
    and condition-based maintenance.
- name: Predictive Maintenance for Rotating Equipment
  description: Vibration and current data from pumps, motors, and compressors flows
    through Amazon Lookout for Equipment or Amazon Monitron APIs to predict failures
    and trigger work orders in CMMS systems.
- name: OPC UA to Cloud Telemetry Pipelines
  description: Manufacturers use Litmus, AWS IoT Greengrass, or HiveMQ to map OPC
    UA tags to MQTT Sparkplug B and stream normalized telemetry through cloud APIs
    for analytics and digital twins.
- name: Manufacturing Execution and OEE
  description: APIs from PTC ThingWorx, Rockwell FactoryTalk, and Siemens MindSphere
    expose production runs, downtime events, and OEE metrics to MES dashboards and
    ERP work-order systems.
- name: Energy Management and Sustainability Reporting
  description: Schneider Electric and Honeywell APIs aggregate sub-meter, HVAC, and
    process-energy data into normalized feeds for sustainability and carbon-reporting
    platforms.
- name: Digital Twin Operations
  description: AWS IoT TwinMaker, Siemens MindSphere, and PTC ThingWorx APIs combine
    3D scenes, asset hierarchies, and live telemetry for remote operations, training,
    and root-cause analysis.
- name: Industrial Data Historian Modernization
  description: Operators expose decades of PI System and AspenTech historian data
    through cloud APIs to power machine learning, anomaly detection, and process-optimization
    workflows.
- name: Edge Protocol Translation
  description: Edge platforms like Litmus and Node-RED ingest Modbus, EtherNet/IP,
    and serial protocols at the gateway and republish them as MQTT, OPC UA, or REST
    APIs for upstream systems.
integrations:
- name: AWS IoT SiteWise
  description: Managed industrial data service that collects, organizes, and analyzes
    equipment telemetry with hierarchical asset models and time-series APIs.
- name: AWS IoT TwinMaker
  description: Digital twin service that combines 3D scenes, real-time data, and entity-relationship
    graphs into APIs for industrial operations.
- name: AWS IoT Greengrass
  description: Edge runtime that runs Lambda functions, ML models, and connectors
    on industrial gateways with local APIs for protocol translation and store-and-forward.
- name: Siemens MindSphere
  description: Industrial IoT cloud platform that connects machines and physical infrastructure
    to APIs for asset management, fleet analytics, and predictive services.
- name: PTC ThingWorx
  description: Industrial IoT platform with APIs for asset modeling, mashups, augmented-reality
    work instructions, and manufacturing analytics.
- name: OSIsoft PI System
  description: De-facto industrial data historian with PI Web API endpoints for streaming,
    querying, and contextualizing decades of process and equipment data.
- name: Litmus Automation
  description: Industrial edge platform that connects PLCs, OPC UA servers, and MQTT
    brokers and exposes normalized data through cloud APIs.
- name: HiveMQ
  description: Enterprise MQTT broker widely used in industrial deployments for Sparkplug
    B telemetry, device management, and edge-to-cloud messaging.
